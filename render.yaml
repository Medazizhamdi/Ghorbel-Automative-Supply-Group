services:
  - type: web
    name: autopieces360-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run prisma:generate --workspace apps/api && npm run build --workspace apps/api
    # Free web services don't support pre-deploy commands. Apply migrations at startup.
    startCommand: npm run prisma:migrate --workspace apps/api && npm run start --workspace apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: autopieces360-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GUEST_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_BOOTSTRAP_KEY
        generateValue: true
databases:
  - name: autopieces360-db
    databaseName: autopieces360
    user: autopieces360
    plan: free
    region: frankfurt
