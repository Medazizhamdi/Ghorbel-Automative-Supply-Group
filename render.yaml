services:
  - type: web
    name: autopieces360-api
    runtime: node
    plan: free
    region: frankfurt
    # NODE_ENV=production can cause npm ci to omit TypeScript and @types build dependencies.
    buildCommand: npm ci --include=dev && npm run prisma:generate --workspace apps/api && npm run build --workspace apps/api
    # Free web services don't support pre-deploy commands. Apply migrations at startup.
    startCommand: npm run prisma:migrate --workspace apps/api && npm run start --workspace apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GUEST_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_BOOTSTRAP_KEY
        generateValue: true
      - key: EMAIL_PROVIDER
        value: gmail-api
      - key: EMAIL_FROM
        value: Ghorbel Automative Supply Group <ghorbelautomotivesupplygroup@gmail.com>
      - key: CONTACT_INBOX_EMAIL
        value: ghorbelautomotivesupplygroup@gmail.com
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
